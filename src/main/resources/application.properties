spring.application.name=user-authentication-service
server.servlet.context-path=/authentication/api
# Configuración de la fuente de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuración de Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#Password pattern
# Exigirá al menos una minúscula, una mayúscula, un número y mínimo 8 caracteres
app.security.password-regex=^(?=.*[0-9])(?=.*[a-z])(?=.*[A-Z]).{8,}$